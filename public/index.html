<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202c">
<title>Cross Builder — percorsi roller &amp; skate cross</title>
<meta name="description" content="Configuratore 2D per percorsi di roller cross e skate cross: area a piacere, percorso custom o generato, controllo delle distanze fra ostacoli.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/svg.css">
<script src="js/firebase-config.js"></script>
</head>
<body>
<header class="top">
  <button class="brand" id="brandBtn" data-act="go.home" title="Torna ai progetti"><span class="logo">⛸</span><span>Cross<b>Builder</b></span></button>
  <input id="prjName" class="prjName" aria-label="Nome del progetto" placeholder="Nome del percorso">
  <div class="seg small" id="discSeg">
    <button class="segb" data-act="discipline:roller">Roller</button>
    <button class="segb" data-act="discipline:skate">Skate</button>
  </div>
  <div class="spacer"></div>
  <button class="tbtn" data-act="undo" title="Annulla (Ctrl+Z)">↶</button>
  <button class="tbtn" data-act="redo" title="Ripeti (Ctrl+Shift+Z)">↷</button>
  <button class="tbtn" data-act="loc.save" title="Salva">💾</button>
  <button class="tbtn" data-act="exp.png" title="Esporta PNG">🖼</button>
  <button class="tbtn" data-act="clear.open:all" title="Svuota il disegno">🗑</button>
  <button class="tbtn" data-act="go.home" title="I miei lavori">📂</button>
  <button class="tbtn panelToggle" id="panelToggle" title="Mostra o nascondi il pannello">☰</button>
</header>

<section class="home" id="home" hidden></section>

<main id="editor">
  <div class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="floatTools" id="floatTools"></div>
    <div class="flyout" id="flyout" hidden></div>

    <div class="hintBar" id="hintBar" hidden></div>
    <div class="statusbar" id="status"></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <aside class="panel" id="panel">
    <div class="panelGrab" id="panelGrab" title="Trascina per allargare o stringere"></div>
    <div class="panelGrip" id="panelGrip"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="panelBody" id="panelBody"></div>
  </aside>
</main>

<div class="modal" id="modal" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
